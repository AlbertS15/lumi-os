# The timezone page's city search finds nothing on this image, and without a city its Next button stays disabled,
# so first setup can't be finished. Skip the page; the clock follows the location (automatic-timezone below), and
# the timezone can be set in Settings → System → Date & Time.
# The keyboard page lets you pick one layout: with Russian alone there is no way to type the Latin user name on
# the next page. Skipping it keeps the defaults below, English (US) and Russian, switched with Super+Space.
[pages]
skip=timezone;keyboard
