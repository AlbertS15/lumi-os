---
name: Boot benchmark

# Boots the published image and this branch's image in QEMU/KVM and compares boot time and size.
on:
  pull_request:
    branches:
      - main
    paths:
      - 'Containerfile'
      - 'build_files/**'
      - 'system_files/**'
      - 'tools/boot-bench.sh'
      - '.github/workflows/boot-bench.yml'
  workflow_dispatch:
    inputs:
      boots:
        description: "Boots per image (the first is the first-ever boot)"
        default: "4"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  BOOTS: ${{ inputs.boots || '4' }}

jobs:
  measure:
    name: Measure ${{ matrix.variant }}
    # bootc-image-builder can't mount on 24.04's successor yet (see build-disk.yml); 24.04 has /dev/kvm.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: [before, after]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install QEMU
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf
          ls -l /dev/kvm

      # "before" is what users have now: the image published from main.
      - name: Pull the published image
        if: matrix.variant == 'before'
        run: |
          sudo podman pull ghcr.io/alberts15/lumi-os:latest
          echo "BENCH_IMAGE=ghcr.io/alberts15/lumi-os:latest" >> "$GITHUB_ENV"

      - name: Lumi rpm
        if: matrix.variant == 'after'
        uses: ./.github/actions/lumi-rpm

      - name: Build this branch's image
        if: matrix.variant == 'after'
        run: |
          sudo podman build --pull=newer -t localhost/lumi-os:bench -f Containerfile .
          echo "BENCH_IMAGE=localhost/lumi-os:bench" >> "$GITHUB_ENV"

      - name: Measure
        run: sudo BENCH_TMP=/mnt tools/boot-bench.sh "$BENCH_IMAGE" "bench-${{ matrix.variant }}" "$BOOTS"

      - name: Upload the measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-${{ matrix.variant }}
          path: bench-${{ matrix.variant }}
          if-no-files-found: warn

  compare:
    name: Compare
    needs: measure
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bench-*

      - name: Table
        run: |
          set -euo pipefail
          # Median of the repeat boots (2..N) per column; boot 1 is shown separately.
          med() { awk -F, -v c="$2" 'NR>2 { print $c }' "$1/summary.csv" | sort -n |
            awk '{ a[NR]=$1 } END { if (NR%2) print a[(NR+1)/2]; else printf "%.3f\n", (a[NR/2]+a[NR/2+1])/2 }'; }
          first() { awk -F, -v c="$2" 'NR==2 { print $c }' "$1/summary.csv"; }
          stat() { awk -v k="$2" '$1==k { print $2 }' "$1/image-stats.txt"; }
          gib() { awk '{ printf "%.2f GiB", $1/1024/1024/1024 }'; }
          b=bench-before; a=bench-after
          {
            echo "| | before | after |"
            echo "|---|---:|---:|"
            for col in 2:kernel 3:initrd 4:userspace 5:total 6:graphical.target; do
              c=${col%%:*}; n=${col#*:}
              echo "| $n, s (median of boots 2-$BOOTS) | $(med $b $c) | $(med $a $c) |"
            done
            echo "| total, s (first boot) | $(first $b 5) | $(first $a 5) |"
            echo "| graphical.target, s (first boot) | $(first $b 6) | $(first $a 6) |"
            echo "| image size (podman, uncompressed) | $(gib < $b/image-bytes.txt) | $(gib < $a/image-bytes.txt) |"
            echo "| /usr | $(stat $b usr_bytes | gib) | $(stat $a usr_bytes | gib) |"
            echo "| rpm packages | $(stat $b rpm_count) | $(stat $a rpm_count) |"
            echo "| qcow2 on disk | $(gib < $b/qcow2-bytes.txt) | $(gib < $a/qcow2-bytes.txt) |"
            echo
            echo "Removed packages:"; echo '```'
            comm -23 <(cut -f2 $b/rpms-by-size.txt | sort) <(cut -f2 $a/rpms-by-size.txt | sort)
            echo '```'
            echo "Units no longer enabled:"; echo '```'
            comm -23 <(awk '{print $1}' $b/enabled-units.txt | sort) <(awk '{print $1}' $a/enabled-units.txt | sort)
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          for v in before after; do
            for n in $(seq 1 "$BOOTS"); do
              echo "<details><summary>$v, boot $n</summary>"; echo; echo '```'
              cat bench-$v/boot-$n-analyze.txt; echo
              head -30 bench-$v/boot-$n-blame.txt; echo
              cat bench-$v/boot-$n-critical-chain.txt
              echo '```'; echo "</details>"
            done
          done >> "$GITHUB_STEP_SUMMARY"
