---
name: Build container image
on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '05 10 * * *'  # 10:05am UTC everyday
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.brand_name}}-${{ inputs.stream_name }}
  cancel-in-progress: true

jobs:
  # One native build per CPU. Each pushes <tag>-<platform>; the manifest job below joins them under the usual tags.
  build_push:
    name: Build and push image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            runner: ubuntu-26.04
            arch: x86_64
          - platform: arm64
            runner: ubuntu-24.04-arm
            arch: aarch64

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      # These stage versions are pinned by https://github.com/renovatebot/renovate
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        if: matrix.platform == 'amd64'
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Maximize build space and install podman (arm64)
        if: matrix.platform == 'arm64'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman skopeo jq > /dev/null
          podman --version
          df -h /

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Check Just Syntax
        shell: bash
        run: |
          just check

      - name: Image Name
        id: image-name
        run: |
          IMAGE_NAME=$(just image_name)

          echo "IMAGE_NAME=${IMAGE_NAME}" >> $GITHUB_ENV

      - name: Default Tag
        id: gen-default-tag
        run: |
          DEFAULT_TAG=$(just generate-default-tag)

          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> $GITHUB_ENV

      - name: Prepare environment
        run: |
          # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}

      # Universal Blue builds silverblue-main for x86-64 only. On arm64, start from the plain Fedora Silverblue
      # that silverblue-main is made from, at the same Fedora version, so both CPUs stay on one release.
      - name: Base image (arm64)
        if: matrix.platform == 'arm64'
        run: |
          set -euo pipefail
          version=$(skopeo inspect --override-arch amd64 docker://ghcr.io/ublue-os/silverblue-main:latest |
            jq -r '.Labels["org.opencontainers.image.version"]' | cut -d. -f1)
          [[ "$version" =~ ^[0-9]+$ ]] || { echo "Could not read the Fedora version of silverblue-main: $version"; exit 1; }
          echo "BASE_IMAGE=quay.io/fedora/fedora-silverblue:${version}" >> $GITHUB_ENV
          echo "Base image: quay.io/fedora/fedora-silverblue:${version}"

      # The arm64 .rpm comes from AlbertS15/Lumi#1 and may not be released yet. Without it, the arm64 leg
      # stops here with a warning (it does not fail), and the manifest job keeps arm64's last image, if any.
      - name: Lumi .rpm for this CPU
        id: lumi
        run: |
          if curl -fsSL https://api.github.com/repos/AlbertS15/Lumi/releases/latest |
              grep -q '"browser_download_url": *"[^"]*-${{ matrix.arch }}\.rpm"'; then
            echo "available=true" >> $GITHUB_OUTPUT
          elif [ '${{ matrix.platform }}' = amd64 ]; then
            echo "::error::The latest Lumi release has no ${{ matrix.arch }} .rpm"
            exit 1
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "::warning::The latest Lumi release has no ${{ matrix.arch }} .rpm yet; skipping the ${{ matrix.platform }} build"
          fi

      # Lumi's rpm from its latest release, cached per release (see build_files/build.sh).
      - name: Lumi rpm
        if: steps.lumi.outputs.available == 'true'
        uses: ./.github/actions/lumi-rpm
        with:
          arch: ${{ matrix.arch }}

      # This actually builds the container image
      - name: Build Image
        if: steps.lumi.outputs.available == 'true'
        id: build-image
        run: |
          just build \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      - name: Check the image is for this CPU and has Lumi
        if: steps.lumi.outputs.available == 'true'
        run: |
          set -euo pipefail
          podman image inspect ${IMAGE_NAME}:${DEFAULT_TAG} --format '{{.Architecture}}' | grep -qx '${{ matrix.platform }}'
          podman run --rm ${IMAGE_NAME}:${DEFAULT_TAG} sh -c '
            set -e
            uname -m
            rpm -qi lumi-launcher
            test "$(rpm -q --qf "%{ARCH}" lumi-launcher)" = "${{ matrix.arch }}"
            test -x /usr/bin/lumi
            grep -E "^(NAME|PRETTY_NAME|VERSION_ID)=" /usr/lib/os-release'

      # This is optional, this provides smaller delta updates
      - name: Rechunk with rpm-ostree
        if: steps.lumi.outputs.available == 'true'
        id: rechunk
        run: |
          just ostree-rechunk \
            ${IMAGE_NAME} \
            ${DEFAULT_TAG}

      # If you are feeling adventurous, use the new distro agnostic rechunker
      # https://github.com/coreos/chunkah
      # You can delete the Rechunk with rpm-ostree portion then if you use this
      #- name: Rechunk with Chunkah
      #  id: rechunk
      #  run: |
      #    just rechunk \
      #      ${IMAGE_NAME} \
      #      ${DEFAULT_TAG}

      # These `if` statements are so that pull requests for your custom images do not make it publish any packages under your name without you knowing
      # They also check if the runner is on the default branch so that things like the merge queue (if you enable it), are going to work
      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: steps.lumi.outputs.available == 'true' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push To GHCR
        if: steps.lumi.outputs.available == 'true' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        id: push-image
        run: |
          set -euox pipefail
          podman push --digestfile=/tmp/digest-${{ matrix.platform }} \
            ${IMAGE_NAME}:${DEFAULT_TAG} ${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}-${{ matrix.platform }}
          mkdir -p /tmp/digests
          cp /tmp/digest-${{ matrix.platform }} /tmp/digests/${{ matrix.platform }}

      - name: Hand the digest to the manifest job
        if: steps.push-image.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.platform }}
          path: /tmp/digests/${{ matrix.platform }}
          retention-days: 1

  # Joins the per-CPU images into one multi-arch image under latest, the date tags and so on, then signs it.
  # Runs even when one CPU failed: amd64 is required, and a failed arm64 keeps its last pushed image.
  manifest:
    name: Push multi-arch manifest
    needs: build_push
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-26.04

    permissions:
      contents: read
      packages: write
      id-token: write

    # Signing runs only once a cosign key is saved as the SIGNING_SECRET repository secret.
    env:
      SIGNING_SECRET: ${{ secrets.SIGNING_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 #v4.0.0

      - name: Prepare environment
        run: |
          IMAGE_NAME=$(just image_name)
          DEFAULT_TAG=$(just generate-default-tag)
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> ${GITHUB_ENV}
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> ${GITHUB_ENV}
          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> ${GITHUB_ENV}

      - name: Generate Build Tags
        id: gen-build-tags
        run: |
          alias_tags="$(just generate-build-tags \
                        ${IMAGE_NAME} \
                        ${DEFAULT_TAG})"

          echo "Tags for this Action..."
          echo "${alias_tags}"
          echo "alias_tags=${alias_tags}" >> $GITHUB_OUTPUT

      - name: Digests from the builds
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push manifest
        id: push-image
        env:
          ALIAS_TAGS: ${{ steps.gen-build-tags.outputs.alias_tags }}
        run: |
          set -euox pipefail
          command -v skopeo > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq skopeo > /dev/null; }
          ls -la /tmp/digests || true
          podman manifest create lumi-os-multiarch
          for platform in amd64 arm64; do
            if [ -s /tmp/digests/${platform} ]; then
              ref="${IMAGE_REGISTRY}/${IMAGE_NAME}@$(< /tmp/digests/${platform})"
            elif [ "${platform}" != amd64 ] && skopeo inspect --raw docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}-${platform} > /dev/null; then
              echo "::warning::${platform} did not build this time; keeping its last image"
              ref="${IMAGE_REGISTRY}/${IMAGE_NAME}:${DEFAULT_TAG}-${platform}"
            elif [ "${platform}" != amd64 ]; then
              echo "::warning::${platform} did not build and has no earlier image; the manifest leaves it out"
              continue
            else
              echo "::error::amd64 did not build"
              exit 1
            fi
            podman manifest add lumi-os-multiarch "docker://${ref}"
          done
          podman manifest inspect lumi-os-multiarch

          for tag in ${ALIAS_TAGS}; do
            podman manifest push --all --digestfile=/tmp/digestfile lumi-os-multiarch docker://${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}
          done

          digest=$(< /tmp/digestfile)

          echo "digest=${digest}" >> $GITHUB_OUTPUT

      # This section is optional and only needs to be enabled if you plan on distributing
      # your project for others to consume. You will need to create a public and private key
      # using Cosign and save the private key as a repository secret in Github for this workflow
      # to consume. For more details, review the image signing section of the README.
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.SIGNING_SECRET != ''
        with:
          # be careful when upgrading major versions
          cosign-release: 'v3.1.2'

      - name: Sign container image
        id: sign-image
        if: env.SIGNING_SECRET != ''
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push-image.outputs.digest }}
        run: |
          # https://github.com/containers/container-libs/issues/388
          # https://github.com/coreos/rpm-ostree/issues/5509
          # use old bundle format, so we can use newer cosign 3.X.X instead of 2.X.X
          # --recursive signs the multi-arch list and each CPU's image, so bootc can verify whichever it pulls.
          cosign sign -y --recursive --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY ${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}
